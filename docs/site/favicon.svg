<svg xmlns="http://www.w3.org/2000/svg" viewBox="245 103 740 740" role="img" aria-label="The Living Vault">
  <defs>
    <!-- palette -->
    <!-- navy  #213B5E   teal #1BB59F   teal-bright #34CFA6   blue #2E8FF5 -->

    <!-- orbit ring: teal (top-left) to blue (bottom-right) -->
    <linearGradient id="tlv-orbit" x1="0.12" y1="0.12" x2="0.92" y2="0.9">
      <stop offset="0" stop-color="#23C3AC"/>
      <stop offset="0.5" stop-color="#23A6D8"/>
      <stop offset="1" stop-color="#2E8FF5"/>
    </linearGradient>

    <!-- leaf fill: bright mint at the tip to teal at the base -->
    <linearGradient id="tlv-leaf" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#46DDA6"/>
      <stop offset="1" stop-color="#16B39C"/>
    </linearGradient>
  </defs>
  <!-- brand tile keeps the mark legible on light or dark browser chrome -->
  <rect x="245" y="103" width="740" height="740" rx="132" fill="#FFFFFF"/>


  <!-- ===================== ORBIT RING (behind everything) ===================== -->
  <circle cx="600" cy="560" r="258" fill="none" stroke="url(#tlv-orbit)" stroke-width="9"/>

  <!-- ===================== SPROUT (over the ring, behind the vault) ===================== -->
  <g fill="none" stroke="#1FBFA6" stroke-width="13" stroke-linecap="round">
    <!-- main stem rising up and to the right from behind the vault -->
    <path d="M 650 415 C 700 360 700 298 728 250 C 748 214 760 196 776 168"/>
  </g>

  <g fill="url(#tlv-leaf)">
    <!-- broad lower-left leaf sweeping over the top-left -->
    <path d="M 706 308 Q 628 250 558 296 Q 648 320 706 308 Z"/>
    <!-- upper-left leaf -->
    <path d="M 744 236 Q 690 168 686 132 Q 738 184 744 236 Z"/>
    <!-- upper-right leaf (carries the sparkle) -->
    <path d="M 750 232 Q 794 154 846 148 Q 810 202 750 232 Z"/>
  </g>

  <!-- leaf midribs -->
  <g fill="none" stroke="#0E8E80" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <path d="M 700 304 Q 632 296 562 296"/>
    <path d="M 740 232 Q 706 184 690 138"/>
    <path d="M 752 230 Q 798 188 840 152"/>
  </g>

  <!-- sparkle / twinkle -->
  <path d="M 860 122 L 868 142 L 888 150 L 868 158 L 860 178 L 852 158 L 832 150 L 852 142 Z"
        fill="#FFFFFF"/>

  <!-- ===================== VAULT DOOR ===================== -->
  <!-- left handle / hinge assembly -->
  <g fill="#213B5E">
    <rect x="356" y="470" width="44" height="56" rx="20"/>
    <rect x="356" y="596" width="44" height="56" rx="20"/>
    <rect x="369" y="510" width="18" height="104" rx="8"/>
    <rect x="392" y="547" width="78" height="28" rx="13"/>
  </g>

  <!-- concentric vault rings -->
  <circle cx="600" cy="560" r="196" fill="#213B5E"/>
  <circle cx="600" cy="560" r="166" fill="#FFFFFF"/>
  <circle cx="600" cy="560" r="140" fill="#213B5E"/>
  <circle cx="600" cy="560" r="110" fill="#FFFFFF"/>

  <!-- six-spoke wheel -->
  <g stroke="#213B5E" stroke-width="24" stroke-linecap="round">
    <g transform="rotate(0 600 560)"><line x1="600" y1="560" x2="692" y2="560"/></g>
    <g transform="rotate(60 600 560)"><line x1="600" y1="560" x2="692" y2="560"/></g>
    <g transform="rotate(120 600 560)"><line x1="600" y1="560" x2="692" y2="560"/></g>
    <g transform="rotate(180 600 560)"><line x1="600" y1="560" x2="692" y2="560"/></g>
    <g transform="rotate(240 600 560)"><line x1="600" y1="560" x2="692" y2="560"/></g>
    <g transform="rotate(300 600 560)"><line x1="600" y1="560" x2="692" y2="560"/></g>
  </g>
  <!-- spoke knobs -->
  <g fill="#213B5E">
    <g transform="rotate(0 600 560)"><circle cx="692" cy="560" r="15"/></g>
    <g transform="rotate(60 600 560)"><circle cx="692" cy="560" r="15"/></g>
    <g transform="rotate(120 600 560)"><circle cx="692" cy="560" r="15"/></g>
    <g transform="rotate(180 600 560)"><circle cx="692" cy="560" r="15"/></g>
    <g transform="rotate(240 600 560)"><circle cx="692" cy="560" r="15"/></g>
    <g transform="rotate(300 600 560)"><circle cx="692" cy="560" r="15"/></g>
  </g>

  <!-- hub -->
  <circle cx="600" cy="560" r="56" fill="#213B5E"/>
  <circle cx="600" cy="560" r="30" fill="#FFFFFF"/>
  <circle cx="600" cy="560" r="11" fill="#213B5E"/>

  <!-- ===================== ORBIT NODES (in front of the ring) ===================== -->
  <circle cx="398" cy="414" r="24" fill="#23C3AC"/>
  <circle cx="851" cy="618" r="22" fill="#FFFFFF" stroke="#2E8FF5" stroke-width="9"/>
  <circle cx="512" cy="802" r="22" fill="#2E8FF5"/>
  <circle cx="706" cy="792" r="18" fill="#2E8FF5"/>

  <!-- ===================== WORDMARK ===================== -->
</svg>
