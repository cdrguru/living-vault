<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Living Vault</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Seed the theme before paint to avoid a flash of the wrong mode or accent.
      (function () {
        try {
          var stored = localStorage.getItem('living-vault:theme');
          var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          var accent = localStorage.getItem('living-vault:accent');
          if (accent && accent !== 'orange') document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {
          /* no-op */
        }
      })();

      // Capture UTM parameters and a cross-domain referrer into localStorage so
      // the demo can attribute a visit. The same capture also runs on the
      // marketing landing (docs/marketing/living-vault.html); keep the two in sync.
      (function () {
        try {
          var params = new URLSearchParams(window.location.search);
          var utmSource = params.get('utm_source');
          if (utmSource) {
            // A url carrying utm_source is a fresh campaign touch: write the whole
            // tuple from this url so a later touch never inherits a stale medium
            // or campaign from an earlier one.
            localStorage.setItem('living-vault:utm_source', utmSource);
            var utmMedium = params.get('utm_medium');
            if (utmMedium) localStorage.setItem('living-vault:utm_medium', utmMedium);
            else localStorage.removeItem('living-vault:utm_medium');
            var utmCampaign = params.get('utm_campaign');
            if (utmCampaign) localStorage.setItem('living-vault:utm_campaign', utmCampaign);
            else localStorage.removeItem('living-vault:utm_campaign');
          }
          // Capture document.referrer if present and from a different domain.
          var referrer = document.referrer;
          if (referrer && referrer.indexOf(window.location.hostname) === -1) {
            localStorage.setItem('living-vault:referrer', referrer);
          }
        } catch (e) {
          /* no-op */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
