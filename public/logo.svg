    <path transform="translate(1129.47 1078) scale(0.150000 -0.150000)" fill="#213B5E" d="M233 740V0H62V740Z"/>
    <path transform="translate(1174.62 1078) scale(0.150000 -0.150000)" fill="#213B5E" d="M373 145V0H286Q193 0 141.0 45.5Q89 91 89 194V416H21V558H89V694H260V558H372V416H260V192Q260 167 272.0 156.0Q284 145 312 145Z"/>
  </g>
</svg>
