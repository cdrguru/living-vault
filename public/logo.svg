    <path transform="translate(814.33 1078) scale(0.150000 -0.150000)" fill="#213B5E" d="M721 702 472 0H258L9 702H191L365 172L540 702Z"/>
    <path transform="translate(924.73 1078) scale(0.150000 -0.150000)" fill="#213B5E" d="M274 566Q333 566 377.5 542.0Q422 518 446 479V558H617V0H446V79Q421 40 376.5 16.0Q332 -8 273 -8Q205 -8 149.0 27.5Q93 63 60.5 128.5Q28 194 28 280Q28 366 60.5 431.0Q93 496 149.0 531.0Q205 566 274 566ZM324 417Q273 417 237.5 380.5Q202 344 202 280Q202 216 237.5 178.5Q273 141 324 141Q375 141 410.5 178.0Q446 215 446 279Q446 343 410.5 380.0Q375 417 324 417Z"/>
